name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"  # weekly: catch newly published CVEs in the locked deps
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint + type gate
    # mypy-baseline.txt was recorded on Windows; platform-specific branches
    # (os.name == "nt") type-check differently elsewhere, so gate on the same OS.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - run: pip install -c requirements-lock.txt -e ".[dev,docs,teams-bot]"
      - name: ruff
        run: ruff check ai_autopilot tests scripts
      - name: mypy (no new errors vs baseline)
        run: python scripts/mypy_gate.py

  test:
    name: Tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest  # where it runs in production
            python: "3.14"
          - os: ubuntu-latest   # the Docker image (python:3.11-slim)
            python: "3.11"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - run: pip install -c requirements-lock.txt -e ".[dev,docs,teams-bot]"
      - name: pytest
        run: python -m pytest -q -n auto --cov=ai_autopilot --cov-report=term:skip-covered --cov-fail-under=80

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pip-audit
      - run: pip-audit --strict -r requirements-lock.txt

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ai-autopilot:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
