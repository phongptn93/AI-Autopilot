<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Autopilot</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg: #0a0b0f; --bg-elev: #111319; --bg-card: #14161e; --bg-sidebar: #0d0e14;
            --bg-input: #0c0d12; --bg-hover: #1b1e28;
            --border: #23262f; --border-soft: #1b1d25;
            --text: #e6e7eb; --text-muted: #8a8d99; --text-dim: #565963;
            --accent: #6366f1; --accent-hover: #818cf8; --accent-bg: rgba(99,102,241,.13);
            --green: #2ecc71; --green-bg: rgba(46,204,113,.13);
            --red: #f0526a; --red-bg: rgba(240,82,106,.13);
            --amber: #f5a623; --amber-bg: rgba(245,166,35,.13);
            --blue: #4d9fff; --blue-bg: rgba(77,159,255,.13);
            --violet: #b07cff; --violet-bg: rgba(176,124,255,.13);
            --radius: 14px; --radius-sm: 9px;
            --shadow: 0 1px 3px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.22);
            --shadow-sm: 0 1px 2px rgba(0,0,0,.35);
            --mono: 'SF Mono', 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
            --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        html { -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
        body { font-family: var(--sans); background: var(--bg); color: var(--text);
            line-height: 1.55; min-height: 100vh; font-size: 14px;
            background-image: radial-gradient(1200px 600px at 80% -10%, rgba(99,102,241,.06), transparent 60%); }
        ::selection { background: var(--accent-bg); }
        a { color: inherit; }

        .layout { display: flex; min-height: 100vh; }
        .sidebar { width: 248px; background: var(--bg-sidebar); border-right: 1px solid var(--border-soft);
            padding: 20px 14px; position: fixed; inset: 0 auto 0 0; display: flex; flex-direction: column; }
        .brand { font-size: 15px; font-weight: 700; letter-spacing: -.01em; padding: 4px 10px 6px;
            display: flex; align-items: center; gap: 10px; }
        .brand-badge { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center;
            background: linear-gradient(135deg, var(--accent), var(--violet)); font-size: 15px; box-shadow: var(--shadow-sm); }
        .nav-section { color: var(--text-dim); font-size: 10.5px; font-weight: 700; text-transform: uppercase;
            letter-spacing: .09em; padding: 16px 12px 6px; }
        .nav-link { display: flex; align-items: center; gap: 11px; padding: 8px 11px; border-radius: 10px;
            color: var(--text-muted); text-decoration: none; font-size: 13.5px; font-weight: 500;
            margin-bottom: 2px; position: relative; transition: background .12s, color .12s; }
        .nav-link .ico { font-size: 15px; width: 18px; text-align: center; }
        .nav-link:hover { background: var(--bg-hover); color: var(--text); }
        .nav-link.active { background: var(--accent-bg); color: var(--accent-hover); }
        .nav-link.active::before { content: ""; position: absolute; left: -14px; top: 7px; bottom: 7px;
            width: 3px; border-radius: 0 3px 3px 0; background: var(--accent); }
        .sidebar-foot { margin-top: auto; padding: 12px 12px 2px; color: var(--text-dim); font-size: 11px;
            border-top: 1px solid var(--border-soft); display: flex; align-items: center; gap: 7px; }
        .live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green);
            box-shadow: 0 0 0 0 rgba(46,204,113,.5); animation: pulse 2.4s infinite; }
        @keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(46,204,113,.5)} 70%{box-shadow:0 0 0 6px rgba(46,204,113,0)} 100%{box-shadow:0 0 0 0 rgba(46,204,113,0)} }

        .main { margin-left: 248px; flex: 1; padding: 30px 38px 60px; max-width: 1500px; }
        .page-header { margin-bottom: 24px; }
        .page-header h2 { font-size: 22px; font-weight: 700; letter-spacing: -.02em; }
        .page-header p { color: var(--text-muted); font-size: 13.5px; margin-top: 3px; }

        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px; margin-bottom: 24px; }
        .stat-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius);
            padding: 18px 20px; box-shadow: var(--shadow-sm); transition: border-color .12s, transform .08s; }
        .stat-card:hover { border-color: var(--border); transform: translateY(-1px); }
        .stat-card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .stat-card-label { font-size: 12px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
        .stat-card-icon { font-size: 16px; opacity: .9; }
        .stat-card-value { font-size: 28px; font-weight: 750; letter-spacing: -.02em; }
        .success-val { color: var(--green); } .failed-val { color: var(--red); }

        .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius);
            margin-bottom: 20px; overflow: hidden; box-shadow: var(--shadow-sm); }
        .card-header { display: flex; justify-content: space-between; align-items: center; gap: 14px;
            padding: 15px 20px; border-bottom: 1px solid var(--border-soft); }
        .card-header h3 { font-size: 14px; font-weight: 650; letter-spacing: -.01em; }
        .card-body { padding: 4px 0; }

        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th { text-align: left; padding: 11px 20px; color: var(--text-dim); font-weight: 600; font-size: 10.5px;
            text-transform: uppercase; letter-spacing: .06em; border-bottom: 1px solid var(--border-soft); }
        td { padding: 11px 20px; border-bottom: 1px solid var(--border-soft); }
        tbody tr { transition: background .1s; }
        tbody tr:hover { background: var(--bg-hover); }
        tr:last-child td { border-bottom: none; }
        .mono { font-family: var(--mono); font-size: 12px; color: var(--text-muted); }
        .id-col { font-weight: 650; color: var(--accent-hover); font-family: var(--mono); }
        .title-col { max-width: 340px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        .badge { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 20px;
            font-size: 11.5px; font-weight: 600; }
        .badge-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
        .badge-success { background: var(--green-bg); color: var(--green); }
        .badge-failed { background: var(--red-bg); color: var(--red); }
        .badge-running { background: var(--blue-bg); color: var(--blue); }
        .badge-retrying { background: var(--amber-bg); color: var(--amber); }
        .cat-badge { display: inline-block; padding: 2px 8px; border-radius: 7px; font-size: 10.5px; font-weight: 700; letter-spacing: .02em; }
        .cat-be { background: var(--blue-bg); color: var(--blue); }
        .cat-fe { background: var(--violet-bg); color: var(--violet); }
        .cat-bug { background: var(--red-bg); color: var(--red); }
        .cat-db { background: var(--amber-bg); color: var(--amber); }
        .cat-qc { background: var(--green-bg); color: var(--green); }
        .cat-req { background: var(--accent-bg); color: var(--accent-hover); }
        .cat-default { background: var(--bg-hover); color: var(--text-muted); }

        .table-link { color: var(--accent-hover); text-decoration: none; font-weight: 500; }
        .table-link:hover { text-decoration: underline; }
        .empty-state { padding: 44px; text-align: center; color: var(--text-muted); }
        .config-table td:first-child { color: var(--text-muted); width: 240px; }
        .config-bool-true { color: var(--green); font-weight: 600; }
        .config-bool-false { color: var(--text-dim); }

        /* ── Buttons ── */
        .btn-save { background: var(--accent); color: #fff; border: none; border-radius: var(--radius-sm);
            padding: 10px 20px; font-size: 13.5px; font-weight: 650; cursor: pointer; font-family: inherit;
            box-shadow: var(--shadow-sm); transition: background .12s, transform .08s; }
        .btn-save:hover { background: var(--accent-hover); transform: translateY(-1px); }
        .btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--text-muted);
            border-radius: var(--radius-sm); padding: 8px 14px; font-size: 13px; font-weight: 600; cursor: pointer;
            font-family: inherit; transition: border-color .12s, color .12s; }
        .btn-ghost:hover { border-color: var(--accent); color: var(--text); }

        /* ── Settings form ── */
        .form-row { display: grid; grid-template-columns: 240px 1fr; gap: 18px; align-items: start;
            padding: 15px 0; border-bottom: 1px solid var(--border-soft); }
        .form-row:last-child { border-bottom: none; }
        .form-row label { color: var(--text); font-size: 13px; font-weight: 600; padding-top: 8px; }
        .form-input input[type=text], .form-input input[type=password], .form-input input[type=number],
        .form-input select, .form-input textarea { width: 100%; max-width: 480px; background: var(--bg-input);
            color: var(--text); border: 1px solid var(--border); border-radius: var(--radius-sm);
            padding: 9px 12px; font-size: 13.5px; font-family: inherit; transition: border-color .12s, box-shadow .12s; }
        .form-input textarea { min-height: 64px; resize: vertical; line-height: 1.5; }
        .form-input input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--accent); margin-top: 8px; }
        .form-input input:focus, .form-input select:focus, .form-input textarea:focus { outline: none;
            border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-bg); }
        .form-help { color: var(--text-dim); font-size: 12px; margin-top: 6px; line-height: 1.5; }
        .restart-badge { display: inline-block; background: var(--amber-bg); color: var(--amber);
            font-size: 10px; padding: 1px 6px; border-radius: 6px; margin-left: 6px; vertical-align: middle; font-weight: 700; }

        /* ── Chips (declared states / tags) ── */
        .chips { display: flex; flex-wrap: wrap; gap: 7px; }
        .chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 11px; border-radius: 20px;
            font-size: 12px; font-weight: 600; background: var(--bg-hover); border: 1px solid var(--border); color: var(--text-muted); }
        .chip.chip-accent { background: var(--accent-bg); color: var(--accent-hover); border-color: transparent; }
        .chip.chip-green { background: var(--green-bg); color: var(--green); border-color: transparent; }
        .chip.chip-amber { background: var(--amber-bg); color: var(--amber); border-color: transparent; }
    </style>
</head>
<body>
<div class="layout">
    <aside class="sidebar">
        <div class="brand"><span class="brand-badge">🤖</span> AI Autopilot</div>
        <div class="nav-section">Operate</div>
        <nav>
            <a class="nav-link {{ 'active' if active == 'overview' else '' }}" href="/dashboard"><span class="ico">📊</span> Overview</a>
            <a class="nav-link {{ 'active' if active == 'board' else '' }}" href="/dashboard/board"><span class="ico">🗂️</span> Board</a>
            <a class="nav-link {{ 'active' if active == 'planning' else '' }}" href="/dashboard/planning"><span class="ico">🧭</span> Planning</a>
            <a class="nav-link {{ 'active' if active == 'history' else '' }}" href="/dashboard/history"><span class="ico">📜</span> History</a>
        </nav>
        <div class="nav-section">Configure</div>
        <nav>
            <a class="nav-link {{ 'active' if active == 'config' else '' }}" href="/dashboard/config"><span class="ico">⚙️</span> Configuration</a>
            <a class="nav-link {{ 'active' if active == 'settings' else '' }}" href="/dashboard/settings"><span class="ico">🛠️</span> Settings</a>
            <a class="nav-link {{ 'active' if active == 'capabilities' else '' }}" href="/dashboard/capabilities"><span class="ico">✨</span> Capabilities</a>
        </nav>
        <div class="sidebar-foot"><span class="live-dot"></span> autopilot online</div>
    </aside>
    <main class="main">
        {% block content %}{% endblock %}
    </main>
</div>
</body>
</html>
