<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Autopilot Dashboard</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg: #0f1117; --bg-card: #1a1d27; --bg-sidebar: #141620;
            --border: #2a2d3a; --text: #e4e5e9; --text-muted: #8b8d97; --text-dim: #5c5e6a;
            --accent: #6366f1; --accent-hover: #818cf8;
            --green: #22c55e; --green-bg: rgba(34,197,94,.12);
            --red: #ef4444; --red-bg: rgba(239,68,68,.12);
            --amber: #f59e0b; --amber-bg: rgba(245,158,11,.12);
            --blue: #3b82f6; --blue-bg: rgba(59,130,246,.12);
            --radius: 12px; --radius-sm: 8px;
        }
        body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg); color: var(--text); line-height: 1.6; min-height: 100vh; }
        .layout { display: flex; min-height: 100vh; }
        .sidebar { width: 260px; background: var(--bg-sidebar); border-right: 1px solid var(--border);
            padding: 24px 16px; position: fixed; top: 0; left: 0; bottom: 0; display: flex; flex-direction: column; }
        .brand { font-size: 18px; font-weight: 700; padding: 0 12px 24px; display: flex; align-items: center; gap: 10px; }
        .nav-link { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: var(--radius-sm);
            color: var(--text-muted); text-decoration: none; font-size: 14px; font-weight: 500; margin-bottom: 4px; transition: .15s; }
        .nav-link:hover { background: var(--bg-card); color: var(--text); }
        .nav-link.active { background: var(--accent); color: #fff; }
        .main { margin-left: 260px; flex: 1; padding: 32px 40px; max-width: 1400px; }
        .page-header { margin-bottom: 28px; }
        .page-header h2 { font-size: 24px; font-weight: 700; }
        .page-header p { color: var(--text-muted); font-size: 14px; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-bottom: 28px; }
        .stat-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; }
        .stat-card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .stat-card-label { font-size: 13px; color: var(--text-muted); font-weight: 500; }
        .stat-card-icon { font-size: 18px; }
        .stat-card-value { font-size: 30px; font-weight: 700; }
        .success-val { color: var(--green); } .failed-val { color: var(--red); }
        .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 24px; overflow: hidden; }
        .card-header { display: flex; justify-content: space-between; align-items: center; padding: 18px 22px; border-bottom: 1px solid var(--border); }
        .card-header h3 { font-size: 15px; font-weight: 600; }
        .card-body { padding: 6px 0; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th { text-align: left; padding: 12px 22px; color: var(--text-muted); font-weight: 600; font-size: 11px;
            text-transform: uppercase; letter-spacing: .5px; border-bottom: 1px solid var(--border); }
        td { padding: 12px 22px; border-bottom: 1px solid var(--border); }
        tr:last-child td { border-bottom: none; }
        .mono { font-family: 'SF Mono', Menlo, monospace; font-size: 12px; color: var(--text-muted); }
        .id-col { font-weight: 600; color: var(--accent-hover); }
        .title-col { max-width: 320px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .badge { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 20px; font-size: 12px; font-weight: 500; }
        .badge-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
        .badge-success { background: var(--green-bg); color: var(--green); }
        .badge-failed { background: var(--red-bg); color: var(--red); }
        .badge-running { background: var(--blue-bg); color: var(--blue); }
        .badge-retrying { background: var(--amber-bg); color: var(--amber); }
        .cat-badge { display: inline-block; padding: 3px 9px; border-radius: var(--radius-sm); font-size: 11px; font-weight: 600; }
        .cat-be { background: var(--blue-bg); color: var(--blue); }
        .cat-fe { background: rgba(168,85,247,.12); color: #a855f7; }
        .cat-bug { background: var(--red-bg); color: var(--red); }
        .cat-db { background: var(--amber-bg); color: var(--amber); }
        .cat-qc { background: var(--green-bg); color: var(--green); }
        .cat-req { background: rgba(99,102,241,.12); color: var(--accent-hover); }
        .cat-default { background: var(--bg-sidebar); color: var(--text-muted); }
        .table-link { color: var(--accent-hover); text-decoration: none; }
        .table-link:hover { text-decoration: underline; }
        .empty-state { padding: 48px; text-align: center; color: var(--text-muted); }
        .config-table td:first-child { color: var(--text-muted); width: 240px; }
        .config-bool-true { color: var(--green); font-weight: 600; }
        .config-bool-false { color: var(--text-dim); }
        /* ── Settings form ── */
        .form-row { display: grid; grid-template-columns: 220px 1fr; gap: 16px; align-items: start;
            padding: 14px 0; border-bottom: 1px solid var(--border); }
        .form-row:last-child { border-bottom: none; }
        .form-row label { color: var(--text-muted); font-size: 13px; font-weight: 500; padding-top: 8px; }
        .form-input input[type=text], .form-input input[type=password], .form-input input[type=number],
        .form-input select { width: 100%; max-width: 460px; background: var(--bg); color: var(--text);
            border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 9px 12px; font-size: 14px;
            font-family: inherit; }
        .form-input input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--accent); margin-top: 8px; }
        .form-input input:focus, .form-input select:focus { outline: none; border-color: var(--accent); }
        .form-help { color: var(--text-dim); font-size: 12px; margin-top: 6px; }
        .restart-badge { display: inline-block; background: var(--amber-bg); color: var(--amber);
            font-size: 10px; padding: 1px 6px; border-radius: 6px; margin-left: 6px; vertical-align: middle; }
        .btn-save { background: var(--accent); color: #fff; border: none; border-radius: var(--radius-sm);
            padding: 11px 22px; font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit; }
        .btn-save:hover { background: var(--accent-hover); }
    </style>
</head>
<body>
<div class="layout">
    <aside class="sidebar">
        <div class="brand">🤖 AI Autopilot</div>
        <nav>
            <a class="nav-link {{ 'active' if active == 'overview' else '' }}" href="/dashboard">📊 Overview</a>
            <a class="nav-link {{ 'active' if active == 'history' else '' }}" href="/dashboard/history">📜 History</a>
            <a class="nav-link {{ 'active' if active == 'config' else '' }}" href="/dashboard/config">⚙️ Configuration</a>
            <a class="nav-link {{ 'active' if active == 'settings' else '' }}" href="/dashboard/settings">🛠️ Settings</a>
            <a class="nav-link {{ 'active' if active == 'capabilities' else '' }}" href="/dashboard/capabilities">✨ Capabilities</a>
        </nav>
    </aside>
    <main class="main">
        {% block content %}{% endblock %}
    </main>
</div>
</body>
</html>
