{% extends "base.html" %}
{% block content %}
<style>
  .er { max-width:560px; margin:8vh auto 0; text-align:center; }
  .er .code { font-size:64px; font-weight:800; letter-spacing:-.03em; color:var(--text-dim); line-height:1; }
  .er h2 { font-size:21px; margin:14px 0 8px; }
  .er p { color:var(--text-muted); font-size:14px; line-height:1.6; margin:0 0 6px; }
  .er .acts { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:20px; }
  .er details { margin-top:18px; text-align:left; font-size:12px; color:var(--text-dim); }
  .er details pre { white-space:pre-wrap; overflow-wrap:anywhere; background:var(--bg-input); border:1px solid var(--border);
    border-radius:8px; padding:10px; font-family:var(--mono); }
</style>
<div class="er">
  <div class="code">{{ code }}</div>
  <h2>{{ heading }}</h2>
  <p>{{ message }}</p>
  <div class="acts">
    <a class="btn-save" href="/dashboard">← Về trang chính</a>
    <button class="btn-ghost" type="button" data-cmdk-open>🔍 Tìm trang <kbd class="cmdk-key">Ctrl K</kbd></button>
    {% if code == 500 %}<a class="btn-ghost" href="{{ request.url.path }}">⟳ Thử lại</a>{% endif %}
  </div>
  {% if detail %}<details><summary>Chi tiết kỹ thuật</summary><pre>{{ detail }}</pre></details>{% endif %}
</div>
{% endblock %}
