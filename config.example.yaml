# AI Autopilot configuration example.
#
# Copy to config.yaml and edit. Any value can be overridden by an environment
# variable named AUTOPILOT_<KEY> (nested keys use "__"), e.g. AUTOPILOT_ADO_PAT.
#
# SECRETS (ado_pat, oauth_app_secret, smtp_password, zalo_oa_access_token) should
# be provided via environment variables, NOT committed here.

# ── Azure DevOps connection ──
ado_organization: "https://dev.azure.com/your-org"
ado_project: "YourProject"
# ado_pat: ""                # prefer env: AUTOPILOT_ADO_PAT
# oauth_app_id: ""           # alternative to PAT
# oauth_app_secret: ""       # prefer env: AUTOPILOT_OAUTH_APP_SECRET

# ── Triggering ──
trigger_tag: "autopilot"
processed_tag: "autopilot-done"
review_tag: "autopilot-review"
poll_interval_seconds: 30
# Work-item states eligible for processing. MUST match your ADO board's states,
# otherwise tagged items are never picked up. Check your board column names.
trigger_states: ["New", "To Do", "Proposed", "Active"]

# ── Who may issue /commands and @mentions ──
# By default only the machine's OWNER (assignee_trigger_user, falling back to
# auto_transition_assignee) may reply "/ai …" — a colleague gets
# "🔒 Trên máy này tôi chỉ nhận lệnh từ: …". Two ways to widen it:
#   command_users        – name the extra accounts (email or full display name)
#   commands_from_anyone – open it to EVERYONE, no list to maintain
# Both scope ONLY the command gate; which work items this machine picks up stays
# scoped to the owner either way.
command_users: []
commands_from_anyone: false

# ── Repository / execution ──
repo_working_directory: "/path/to/your/git/repo"
base_branch: "development"
max_concurrent: 1
task_timeout_minutes: 30
dry_run: false
# Run each execution in its own git worktree (safe parallel execution).
# Required if you raise max_concurrent above 1 on a shared repo.
use_worktrees: true
worktrees_dir: ""            # empty → <system temp>/ai-autopilot-worktrees

# Multi-repo: route categories to different repos (overrides repo_working_directory)
repos: []
#   - name: backend
#     path: /repos/backend
#     base_branch: develop
#     categories: [BackendTask, DatabaseTask]
#   - name: frontend
#     path: /repos/frontend
#     base_branch: main
#     categories: [FrontendTask]

# ── Claude execution ──
claude_model: ""             # empty → SDK default
claude_max_turns: 0          # 0 → unbounded
# Permission mode for autonomous runs:
#   "acceptEdits"       – autonomous, works when running as root (default)
#   "bypassPermissions" – fully autonomous, but the CLI refuses it under root;
#                          only use when the service runs as a non-root user
claude_permission_mode: "acceptEdits"
claude_allowed_tools: []     # empty = all tools available

# ── Retry & recovery ──
max_retries: 3
retry_backoff_seconds: 60

# ── Autonomy (loop-engineering L1/L2/L3) ──
#   report     – classify + comment what it would do, no code changes
#   assisted   – execute and open a DRAFT PR for human review (default)
#   unattended – execute and open a normal PR, auto-resolving the item
autonomy_level: "assisted"
require_approval: true        # legacy flag, superseded by autonomy_level
approval_timeout_minutes: 120

# ── RBAC (empty list = no restriction) ──
allowed_users: []
approver_users: []
allowed_skills: []

# ── Decomposition / feedback / review ──
auto_decompose: true
feedback_loop_enabled: false
max_revisions: 3
auto_review_enabled: true
block_on_severity: "Critical,High"
# Reviewers on the PRs the autopilot opens. The assignee of the work item is the
# person who should look at the code — ADO notifies them once they're added.
# pr_extra_reviewer_ids takes ADO identity GUIDs (not emails): the reviewers API is
# keyed on the identity id. Required reviewers block completing the PR until they vote.
pr_add_assignee_as_reviewer: false
pr_extra_reviewer_ids: []
pr_reviewers_required: false
# Retrospective learning loop: remember what auto-review flagged, per repo, in
# <workspace>/.autopilot/lessons/<repo>.md and inject the most recent lessons into the
# next run's brief. Read/prune them on the dashboard's Learning page.
learning_loop_enabled: false
lessons_max_injected: 8               # 0 = keep recording, stop injecting
# Resume the Claude Agent session per (repo, branch) across revise rounds — follow-ups
# keep prior context (cheaper, more consistent). Falls back to a fresh session if resume
# fails (e.g. not on this host). Off by default.
reuse_claude_session: false
claude_session_ttl_hours: 24
# Route role commands (/spec /qc /security /review /test /impact) to their purpose-built
# subagents in .claude/agents for expert results. Falls back to the generic skill if the
# subagent isn't present.
use_specialized_agents: true

# ── PR reviewer tracking ──
# Watch the reviewer list of EVERY active PR (any author): dashboard status,
# auto AI-review + vote when the bot account is added as a reviewer, and one
# polite reminder for reviewers who sit vote-less past the deadline.
pr_reviewer_tracking_enabled: false
pr_auto_review_on_added: false        # bot added as reviewer → structured review + vote (opt-in)
pr_reviewer_poll_interval_seconds: 30
pr_reviewer_reminder_hours: 24       # 0 = reminders off
pr_reviewer_reminder_repeat_hours: 0 # keep nudging every N h until they vote; 0 = nudge once
pr_bot_identity: ""                  # blank = auto-detect the PAT's own identity
# Only track/review/show PRs merging INTO these target branches. Empty = all targets.
pr_reviewer_target_branches: []      # e.g. ["dxfac/development", "main"]

# ── Two-way Microsoft Teams bot (optional, `pip install .[teams-bot]`) ──
# App ID / secret / tenant are NOT set here — see .env.example (secrets never in
# config.yaml). This only toggles the feature; the bot stays off if those three
# values aren't also present.
teams_agent_enabled: false
teams_agent_nlu_enabled: true         # free-text read-only queries when enabled above
teams_agent_digest_interval_hours: 0  # proactive activity digest (stats, PRs, standup); 0 = off
teams_agent_digest_at: ""             # or a fixed local time, e.g. "09:00" — wins over the interval

# ── Dependency-aware scheduling (P1) ──
# Order work by the ADO link graph instead of dispatching every pending item at
# once. An item waits for its Predecessor links (Dependency-Reverse) to be done;
# two Related items never run concurrently (they likely touch the same code).
# Deferred items are re-evaluated next poll — waves emerge across cycles. Reads
# links only, calls no model (0 tokens). Set false to keep plain priority order.
dependency_scheduling_enabled: true
# Heuristic: treat sibling candidates (same Parent + same category, e.g. two [BE]
# tasks under one Requirement) as a Related soft-conflict even without an explicit
# link. Off by default — enable if siblings often collide.
sibling_conflict_scheduling: false

# ── Closed-loop SDLC engine (v2, Phase 1) — opt-in, PER-MACHINE ──
# When enabled, items route through the SdlcLoopEngine: a PROFILE-selected ordered
# list of SDLC stages, each gated (revise under one shared budget, escalate on
# exhaustion), then handed off to the next machine's role via an ADO state. Off by
# default → behaviour is unchanged. sdlc_profile is the PRIMARY per-machine knob.
#
# Example team split (each person's machine sets its own profile + trigger_states):
#   BA machine:     sdlc_profile: ba    trigger_states: [New, Proposed]
#                   sdlc_profile_states: { ba: "Ready for Dev" }
#   Dev machine:    sdlc_profile: dev   trigger_states: ["Ready for Dev"]
#                   sdlc_profile_states: { dev: "Ready to Test" }
#   Tester machine: sdlc_profile: qc    trigger_states: ["Ready to Test"]
#                   sdlc_profile_states: { qc: "Ready to Deploy" }
sdlc_loop_enabled: false
sdlc_max_iterations: 3
sdlc_profile: ""                # "ba" | "dev" | "qc" | "review" | "design" | "full"
sdlc_default_profile: "full"
sdlc_profile_tag_prefix: "sdlc:"   # per-item override, e.g. tag "sdlc:dev"
sdlc_advance_on_draft: false
sdlc_type_profiles: {}          # { Bug: dev, "User Story": full }
sdlc_profiles: {}               # extra/override profiles: { mini: [implement, pr] }
sdlc_profile_states: {}         # profile → handoff ADO state
sdlc_stages: []                 # explicit ordered stage override (wins over profile)

# ── Scheduling (empty start/end = always on) ──
schedule_start: ""           # "08:00"
schedule_end: ""             # "18:00"
schedule_days: "Mon,Tue,Wed,Thu,Fri"

# ── Web / health ──
health_host: "0.0.0.0"
health_port: 5080
# Dashboard access is password-gated. On first start with none of the values
# below set, the CLI prompts for a password and stores its PBKDF2 hash here.
# dashboard_auth_password_hash: ""   # auto-filled by the first-run prompt (never plaintext)
# dashboard_auth_token: ""           # legacy plaintext alternative (prefer the hash above)
# webhook_secret: ""                 # require X-Webhook-Secret on POST /api/webhook/*
# Password that encrypts the FULL config export (the download that INCLUDES
# secrets). Needed to decrypt the exported .enc file. Override via env in prod.
config_export_password: "Export#12345"

# ── Persistence ──
database_url: "sqlite+aiosqlite:///autopilot.db"

# ── Cost tracking ──
daily_budget_tokens: 0       # 0 = unlimited
cost_alert_enabled: false

# ── Multi-tenant (empty = single tenant from the config above) ──
tenants: []

# ── Scheduled loops (loop-engineering production patterns) ──
# Each runs a skill on a cadence (cron OR interval_minutes) and opens a PR.
scheduled_loops: []
#   - name: dependency-sweeper
#     prompt: "/update-deps"
#     cron: "0 6 * * 1"          # Mondays 06:00
#     draft_pr: true
#   - name: changelog-drafter
#     prompt: "/draft-changelog"
#     interval_minutes: 1440      # daily
#   - name: ci-sweeper
#     prompt: "Find and fix the most recent failing CI check on the base branch."
#     interval_minutes: 360       # every 6h
#     base_branch: development

# ── Plugins ──
plugins_directory: "plugins"

# ── Notifications ──
teams_webhook_url: ""        # MS Teams Workflows webhook URL
# zalo_oa_access_token: ""   # prefer env
zalo_recipient_user_id: ""
smtp_host: ""
smtp_port: 587
smtp_user: ""
# smtp_password: ""          # prefer env
email_to: ""
email_from: ""
pr_advisory_max_per_commit: 2        # /review runs allowed per commit; 0 = unlimited
pr_auto_review_max_per_pr: 0         # lifetime auto-reviews per PR; 0 = unlimited
pr_review_max_concurrent: 0          # 0 = share max_concurrent with task execution
