services:
  autopilot:
    build: .
    container_name: ai-autopilot
    ports:
      - "5080:5080"
    volumes:
      - autopilot-data:/data
      - autopilot-logs:/app/logs
      - ./config.yaml:/app/config.yaml:ro
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - AUTOPILOT_ADO_PAT=${AUTOPILOT_ADO_PAT}
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: autopilot-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - autopilot
    profiles:
      - monitoring

  grafana:
    image: grafana/grafana:latest
    container_name: autopilot-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus
    profiles:
      - monitoring

volumes:
  autopilot-data:
  autopilot-logs:
