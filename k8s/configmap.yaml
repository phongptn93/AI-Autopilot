apiVersion: v1
kind: ConfigMap
metadata:
  name: autopilot-config
data:
  AUTOPILOT_ADO_ORGANIZATION: "https://dev.azure.com/your-org"
  AUTOPILOT_ADO_PROJECT: "YourProject"
  AUTOPILOT_TRIGGER_TAG: "autopilot"
  AUTOPILOT_PROCESSED_TAG: "autopilot-done"
  AUTOPILOT_POLL_INTERVAL_SECONDS: "30"
  AUTOPILOT_MAX_CONCURRENT: "1"
  AUTOPILOT_TASK_TIMEOUT_MINUTES: "30"
  AUTOPILOT_DRY_RUN: "false"
  AUTOPILOT_BASE_BRANCH: "development"
  AUTOPILOT_HEALTH_PORT: "5080"
  AUTOPILOT_REQUIRE_APPROVAL: "true"
  AUTOPILOT_AUTO_REVIEW_ENABLED: "true"
  AUTOPILOT_DATABASE_URL: "sqlite+aiosqlite:////data/autopilot.db"
