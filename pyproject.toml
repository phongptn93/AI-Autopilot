[project]
name = "ai-autopilot"
version = "2.6.1"
description = "Autonomously process Azure DevOps work items with the Claude Agent SDK"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "AI Autopilot" }]

dependencies = [
    "claude-agent-sdk>=0.2.110",
    "fastapi>=0.115.0",
    "python-multipart>=0.0.12",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "PyYAML>=6.0.2",
    "SQLAlchemy[asyncio]>=2.0.35",
    "aiosqlite>=0.20.0",
    "APScheduler>=3.10.4",
    "prometheus-client>=0.21.0",
    "structlog>=24.4.0",
    "Jinja2>=3.1.4",
    "aiosmtplib>=3.0.2",
    "cryptography>=43.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]
# Two-way Microsoft Teams bot (approve/reject buttons, chat commands). Optional —
# ai_autopilot/teams_agent.py degrades to a no-op if these aren't installed or
# teams_agent_enabled is off, so the base install is unaffected.
teams-bot = [
    "microsoft-agents-hosting-fastapi>=1.2.0",
    "microsoft-agents-hosting-teams>=1.2.0",
    "microsoft-agents-authentication-msal>=1.2.0",
]

[project.scripts]
ai-autopilot = "ai_autopilot.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ai_autopilot"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "SIM"]
ignore = ["B008"]  # FastAPI Depends() in defaults

[tool.ruff.lint.per-file-ignores]
# Sync filesystem checks inside async tests are fine.
"tests/**" = ["ASYNC240"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
ignore_missing_imports = true
